name: Build Schach 1001 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Projekt entpacken
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/schach.tar.gz
          tar -xzf /tmp/schach.tar.gz -C "$GITHUB_WORKSPACE"                                         
      - name: Online-Spielmodi und Android-Navigation integrieren
        run: python3 online/integrate_android.py
      - name: Neue Paket-ID setzen
        shell: bash
        run: |
          grep -rl 'at\.schach1001\.pro' . --exclude-dir=.git | xargs -r sed -i 's/at\.schach1001\.pro/at.schach1001.pro2/g'
      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

  

      - name: Android SDK Pakete installieren
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Optionalen Release-Signierschlüssel vorbereiten
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.CHESS_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CHESS_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CHESS_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CHESS_ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/chess-online-release.jks"
            chmod 600 "$RUNNER_TEMP/chess-online-release.jks"
            echo "CHESS_SIGNING_STORE_PATH=$RUNNER_TEMP/chess-online-release.jks" >> "$GITHUB_ENV"
            echo "CHESS_SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "CHESS_SIGNING_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "CHESS_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Release signing enabled."
          else
            echo "No persistent signing key configured. Debug APK only; do not uninstall the existing app."
          fi
      - name: APK bauen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/outputs/apk/online
          if [[ -n "${CHESS_SIGNING_STORE_PATH:-}" ]]; then
            gradle :app:assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/online/Schach-1001-Pro-Online.apk
            printf 'SIGNED_RELEASE: Update works ONLY with the same key as the installed Android package.\n' > app/build/outputs/apk/online/Signatur-Info.txt
          else
            gradle :app:assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/online/Schach-1001-Pro-Online.apk
            printf 'DEBUG: Not necessarily update-compatible. Do NOT uninstall the existing app or delete its data.\n' > app/build/outputs/apk/online/Signatur-Info.txt
          fi
      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Schach-1001-Pro-Online-APK
          path: app/build/outputs/apk/online/
          retention-days: 30
