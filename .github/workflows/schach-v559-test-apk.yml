name: Schach Pro V5.59 Android Test APK
on:
  push:
    branches: [schach-v559-neustart]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK from runner
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          else
            test -d "$SDK/platforms/android-35"
          fi
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install online variant and rating test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r online/requirements.txt pytest httpx
      - name: Verify variant rules, multiplayer and Glicko-2
        run: python -m pytest online/tests -q
      - name: Test Android chess UI button wiring and engine safeguards
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check chess JavaScript syntax
        run: |
          node --check app/src/main/assets/www/analysis.js
      - name: Install pinned Stockfish 19 Lite single-thread (offline)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/schach-stockfish19
          cd /tmp/schach-stockfish19
          npm pack stockfish@19.0.1 --silent > tarball-name.txt
          tar -xzf "$(cat tarball-name.txt)"
          JS="$(find package -type f -name 'stockfish-19-lite-single.js' -print -quit)"
          WASM="$(find package -type f -name 'stockfish-19-lite-single.wasm' -print -quit)"
          test -n "$JS" && test -n "$WASM"
          python "$GITHUB_WORKSPACE/scripts/embed_stockfish19.py" "$JS" "$WASM" "$GITHUB_WORKSPACE/app/src/main/assets/www/stockfish-local-assets.js"
          cd "$GITHUB_WORKSPACE"
          node --check app/src/main/assets/www/stockfish-local-assets.js
          test "$(wc -c < app/src/main/assets/www/stockfish-local-assets.js)" -gt 100000
      - name: Verify V5.59 assets
        run: |
          test -s app/src/main/assets/www/index.html
          test -s app/src/main/java/at/schachpro/neustart/MainActivity.java
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify Android debug APK identity and signing
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='at.schachpro.neustart'"
          echo "::notice::DEBUG APK is NOT update-compatible with an existing release-signed installation."
      - name: Check reproducible Stockfish package and test syntax
        run: |
          python -m py_compile scripts/embed_stockfish19.py
          node --check app/src/main/assets/www/analysis.js
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Schach-Pro-V559-Neustart-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
