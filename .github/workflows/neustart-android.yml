name: Schach Pro Neustart – Android Test
on:
  workflow_dispatch:
  push:
    branches: [schach-v559-neustart]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: V5.59 assets presence
        run: |
          test -s app/src/main/assets/www/index.html || { echo "::error::V5.59 assets missing; no placeholder APK will be built"; exit 1; }
          test -s app/src/main/assets/www/analysis.js
          test -s app/src/main/assets/www/stockfish-local-assets.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle :app:assembleDebug --no-daemon
      - name: APK verify
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name=\x27at.schachpro.neustart\x27"
      - uses: actions/upload-artifact@v4
        with:
          name: Schach-Pro-Neustart-DEBUG-APK
          path: app/build/outputs/apk/debug/app-debug.apk
