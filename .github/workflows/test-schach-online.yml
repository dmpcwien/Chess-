name: Test Schach Online & Varianten
on:
  push:
    paths:
      - 'online/**'
      - '.github/workflows/test-schach-online.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r online/requirements.txt pytest
      - run: python -m pytest -q online/tests
