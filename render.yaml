# Render Blueprint for Schach 1001+ Pro online multiplayer server.
# Dashboard: New > Blueprint > connect the dmpcwien/Chess- repository.
services:
  - type: web
    name: schach-1001-online
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./online/Dockerfile
    dockerContext: ./online
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # Database is an existing Free Render PostgreSQL service in this workspace.
      # Do not put connection credentials in GitHub.
      - key: RATING_DATABASE_URL
        fromDatabase:
          name: schach-1001-ratings
          property: connectionString
